openapi: 3.0.3
info:
  title: Refund requests API
  version: 1.0.0
  description: API заявок на возврат денежных средств.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: health
      summary: Проверить доступность сервиса
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok]
