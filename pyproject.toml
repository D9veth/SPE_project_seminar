[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-contract-workshop"
version = "0.1.0"
description = "Contract-first workshop for a refund request API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "schemathesis>=4,<5", "PyYAML>=6,<7", "openapi-spec-validator>=0.7,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["refund_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["assignment: проверки контракта и бизнес-сценариев задания"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".local-solution"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
